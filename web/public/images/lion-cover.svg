<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <rect width="300" height="400" fill="#FEF3C7"/>
  <rect x="10" y="10" width="280" height="380" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="4"/>
  <!-- mane -->
  <circle cx="150" cy="185" r="85" fill="#F97316"/>
  <!-- face -->
  <circle cx="150" cy="180" r="65" fill="#FCD34D"/>
  <!-- ears -->
  <circle cx="100" cy="135" r="22" fill="#FCD34D"/>
  <circle cx="200" cy="135" r="22" fill="#FCD34D"/>
  <!-- inner ears -->
  <circle cx="100" cy="135" r="12" fill="#FBBF24"/>
  <circle cx="200" cy="135" r="12" fill="#FBBF24"/>
  <!-- eyes -->
  <ellipse cx="133" cy="170" rx="10" ry="12" fill="#1F2937"/>
  <ellipse cx="167" cy="170" rx="10" ry="12" fill="#1F2937"/>
  <circle cx="136" cy="167" r="4" fill="white"/>
  <circle cx="170" cy="167" r="4" fill="white"/>
  <!-- nose -->
  <ellipse cx="150" cy="193" rx="12" ry="8" fill="#B45309"/>
  <!-- mouth -->
  <path d="M138 205 Q150 218 162 205" stroke="#B45309" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <line x1="95" y1="195" x2="135" y2="195" stroke="#92400E" stroke-width="2"/>
  <line x1="95" y1="202" x2="133" y2="200" stroke="#92400E" stroke-width="2"/>
  <line x1="165" y1="195" x2="205" y2="195" stroke="#92400E" stroke-width="2"/>
  <line x1="167" y1="200" x2="205" y2="202" stroke="#92400E" stroke-width="2"/>
  <!-- title text -->
  <text x="150" y="310" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#78350F">ライオンの</text>
  <text x="150" y="342" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#78350F">ルーくん</text>
</svg>
